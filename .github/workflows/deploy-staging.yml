name: Deploy to staging

on:
  push:
    branches: [fusion-frontend-dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger restricted staging deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key root@93.127.217.163 "true"
