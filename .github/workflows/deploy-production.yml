name: Deploy to production

# Manual only, on purpose. Code deploy never runs migrations automatically -
# see migrate-production.yml for the separate, explicitly-approved migration step.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger restricted production code deploy (no media, no DB, no migrations)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key root@93.127.217.163 "true"
